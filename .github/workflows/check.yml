name: Check official TV sources
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    paths:
      - maintain.py
      - channels.json
      - test_maintain.py
      - .github/workflows/check.yml
permissions:
  contents: write
concurrency:
  group: official-tv-check
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media decoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Test validator
        run: python -m unittest -v
      - name: Audit from cloud (never label US checks as UK)
        run: python maintain.py --scope cloud
      - name: Publish audit and expire old UK results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/cloud.json reports/cloud.md public/uk.m3u public/uk-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update official-source audit'
            git push
          fi
      - name: Show report
        run: cat reports/cloud.md >> "$GITHUB_STEP_SUMMARY"
